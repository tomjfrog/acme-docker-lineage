# Customer talking point: rename without CI cooperation — same digests/layers,
# no Evidence on the new name; Tier 2 layer matching still finds golden.
# Copies payments-api:2.0.0 in the catalog to billing-service:9.9.9.
name: 04 Rename without CI metadata

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-rename:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          jf_url: ${{ env.JF_URL }}
          docker_registry: ${{ env.JF_DOCKER_REGISTRY }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          write_evidence_key: "false"
          image_tag: "9.9.9"

      - name: Rename payments-api → billing-service (no Evidence)
        run: ./lab/scripts/steps/publish-rename.sh
