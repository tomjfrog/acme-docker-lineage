# Customer talking point: publish the approved golden base (Foo) with Build Info
# and golden-base Evidence — the catalog termination set for lineage.
name: 01 Publish golden

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  publish-golden:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
      DOCKER_REPO: lineage-docker-local
      GOLDEN_NAME: golden-base
      GOLDEN_TAG: 1.0.0
      BUILD_NAME: acme-lineage-golden
      KEY_ALIAS: acme-lineage-lab
      PREDICATE_TYPE_GOLDEN: https://jfrog.com/evidence/acme-docker-lineage/golden-base/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set job env
        run: |
          set -euo pipefail
          IMAGE="${JF_DOCKER_REGISTRY}/${DOCKER_REPO}/${GOLDEN_NAME}:${GOLDEN_TAG}"
          BNUM="${GITHUB_RUN_NUMBER}-${GOLDEN_TAG}"
          {
            echo "BUILD_NUM=${BNUM}"
            echo "CI=true"
            echo "GOLDEN_IMAGE=${IMAGE}"
            echo "OUT_DIR=lab/out/${GITHUB_RUN_NUMBER}"
          } >> "${GITHUB_ENV}"
          echo "Resolved BUILD_NUM=${BNUM} image=${IMAGE}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup JFrog CLI (OIDC)
        if: ${{ !env.ACT }}
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          version: 2.120.0
          oidc-provider-name: ${{ secrets.OIDC_PROVIDER_NAME }}

      # JF_ACCESS_TOKEN stays scoped to this step: at job level it would override
      # the OIDC exchange and break the post-job Evidence collection.
      - name: Setup JFrog CLI (access token)
        if: ${{ env.ACT }}
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        with:
          version: 2.120.0

      - name: Docker login to Artifactory (OIDC)
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.JF_DOCKER_REGISTRY }}
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - name: Docker login to Artifactory (act)
        if: ${{ env.ACT }}
        run: jf docker login "${JF_DOCKER_REGISTRY}"

      - name: Build and push golden (multi-arch)
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: lab/golden
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.GOLDEN_IMAGE }}

      - name: Record index digest
        run: |
          set -euo pipefail
          echo "GOLDEN_DIGEST=${{ steps.build-and-push.outputs.digest }}" >> "${GITHUB_ENV}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: oci://${{ env.JF_DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.GOLDEN_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}

      - name: Write Evidence signing key
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/evidence.key"
          if [[ -z "${EVIDENCE_SIGNING_KEY}" ]]; then
            echo "::error::EVIDENCE_SIGNING_KEY repository secret is required"
            exit 1
          fi
          if printf '%s' "${EVIDENCE_SIGNING_KEY}" | grep -q "BEGIN"; then
            printf '%s\n' "${EVIDENCE_SIGNING_KEY}" > "${KEY_FILE}"
          else
            printf '%s' "${EVIDENCE_SIGNING_KEY}" | base64 --decode > "${KEY_FILE}"
          fi
          chmod 600 "${KEY_FILE}"
          echo "EVIDENCE_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"

      - name: Publish JFrog Build Info
        run: |
          set -euo pipefail
          IMAGE_FILE="${RUNNER_TEMP}/golden-image-file.json"
          jq -n --arg image "${GOLDEN_IMAGE}@${GOLDEN_DIGEST}" '{image: $image}' > "${IMAGE_FILE}"
          cat "${IMAGE_FILE}"
          jf rt build-docker-create "${DOCKER_REPO}" \
            --image-file "${IMAGE_FILE}" \
            --build-name "${BUILD_NAME}" \
            --build-number "${BUILD_NUM}"
          jf rt build-collect-env "${BUILD_NAME}" "${BUILD_NUM}" || true
          jf rt build-publish "${BUILD_NAME}" "${BUILD_NUM}"

      - name: Set golden properties
        run: |
          set -euo pipefail
          jf rt set-props \
            "${DOCKER_REPO}/${GOLDEN_NAME}/${GOLDEN_TAG}/" \
            "golden.image=true;com.acme.image.role=golden-base;com.acme.lineage.lab=true"

      - name: Capture lineage artifacts (amd64 layers)
        run: |
          set -euo pipefail
          RUN_DIR="${OUT_DIR}"
          mkdir -p "${RUN_DIR}"
          docker pull --platform linux/amd64 "${GOLDEN_IMAGE}"
          PLATFORM_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "${GOLDEN_IMAGE}" | sed -E 's/.*@//')"
          docker image inspect --format '{{json .RootFS.Layers}}' "${GOLDEN_IMAGE}" | jq -r '.[]' > "${RUN_DIR}/golden.layers.txt"
          printf '%s\n' "${GOLDEN_DIGEST}" > "${RUN_DIR}/golden.digest.txt"
          printf '%s\n' "${PLATFORM_DIGEST}" > "${RUN_DIR}/golden.amd64.digest.txt"
          printf '%s\n' "${GOLDEN_IMAGE}" > "${RUN_DIR}/golden.ref.txt"
          echo "PLATFORM_DIGEST=${PLATFORM_DIGEST}" >> "${GITHUB_ENV}"
          echo "RUN_DIR=${RUN_DIR}" >> "${GITHUB_ENV}"

      - name: Attach golden Evidence
        run: |
          set -euo pipefail
          PREDICATE="${RUN_DIR}/golden-evidence.json"
          jq -n \
            --arg image_ref "${GOLDEN_IMAGE}" \
            --arg image_digest "${GOLDEN_DIGEST}" \
            --arg build_name "${BUILD_NAME}" \
            --arg build_number "${BUILD_NUM}" \
            --arg created_at "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              role: "golden-base",
              image_ref: $image_ref,
              image_digest: $image_digest,
              approved: true,
              lab: "acme-docker-lineage",
              build_name: $build_name,
              build_number: $build_number,
              created_at: $created_at
            }' > "${PREDICATE}"
          OUT="${RUN_DIR}/golden-evidence-create.json"
          if jf evd create \
            --package-name "${GOLDEN_NAME}" \
            --package-version "${GOLDEN_TAG}" \
            --package-repo-name "${DOCKER_REPO}" \
            --predicate "${PREDICATE}" \
            --predicate-type "${PREDICATE_TYPE_GOLDEN}" \
            --key "${EVIDENCE_KEY_FILE}" \
            --key-alias "${KEY_ALIAS}" \
            | tee "${OUT}"; then
            echo "Package-scoped golden Evidence attached"
          elif jf evd create \
            --subject-repo-path "${DOCKER_REPO}/${GOLDEN_NAME}/${GOLDEN_TAG}/list.manifest.json" \
            --predicate "${PREDICATE}" \
            --predicate-type "${PREDICATE_TYPE_GOLDEN}" \
            --key "${EVIDENCE_KEY_FILE}" \
            --key-alias "${KEY_ALIAS}" \
            | tee "${OUT}"; then
            echo "Subject-path Evidence attached (list.manifest.json)"
          else
            jf evd create \
              --subject-repo-path "${DOCKER_REPO}/${GOLDEN_NAME}/${GOLDEN_TAG}/manifest.json" \
              --predicate "${PREDICATE}" \
              --predicate-type "${PREDICATE_TYPE_GOLDEN}" \
              --key "${EVIDENCE_KEY_FILE}" \
              --key-alias "${KEY_ALIAS}" \
              | tee "${OUT}"
          fi

      - name: Upload this-run logs
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ github.run_number }}-${{ env.GOLDEN_TAG }}
          path: ${{ env.OUT_DIR }}/
          if-no-files-found: warn
