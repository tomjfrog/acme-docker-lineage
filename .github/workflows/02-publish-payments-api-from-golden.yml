# Build payments-api FROM golden and attach derived-from Evidence
# (Tier 1 explicit lineage that survives rename at the digest level).
name: 02 Publish payments-api from golden

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id from 01 Publish golden (required for digest chaining)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish-payments-api:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL || 'https://tomjpd2.jfrog.io' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prior run artifacts
        uses: actions/download-artifact@v4
        with:
          name: lineage-run-${{ inputs.run_id }}
          path: lab/out/${{ inputs.run_id }}/
        continue-on-error: true

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          run_id: ${{ inputs.run_id }}
          jf_url: ${{ env.JF_URL }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          oidc_audience: ${{ secrets.OIDC_AUDIENCE }}

      - name: Publish payments-api
        run: ./lab/scripts/steps/publish-payments-api.sh

      - name: Upload run artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-run-${{ env.RUN_ID }}
          path: lab/out/${{ env.RUN_ID }}/
          if-no-files-found: warn
