# Customer talking point: build payments-api FROM golden and attach derived-from Evidence
# (Tier 1 explicit lineage that survives rename at the digest level).
# Resolves golden-base:1.0.0 from the catalog — does not chain GitHub run ids.
name: 02 Publish payments-api from golden

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-payments-api:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          jf_url: ${{ env.JF_URL }}
          docker_registry: ${{ env.JF_DOCKER_REGISTRY }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          image_tag: "2.0.0"

      - name: Publish payments-api
        run: ./lab/scripts/steps/publish-payments-api.sh
