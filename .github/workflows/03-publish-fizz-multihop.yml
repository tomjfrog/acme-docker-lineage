# Multi-hop Fizz FROM payments-api with immediate-parent-only
# Evidence — root-is-golden needs Evidence walk or layer-prefix (Tier 1+2).
# Resolves payments-api:2.0.0 from the catalog — does not chain GitHub run ids.
name: 03 Publish Fizz multi-hop

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-fizz:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          jf_url: ${{ env.JF_URL }}
          docker_registry: ${{ env.JF_DOCKER_REGISTRY }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          image_tag: "0.1.0"

      - name: Publish Fizz (fizz-service)
        run: ./lab/scripts/steps/publish-fizz.sh
