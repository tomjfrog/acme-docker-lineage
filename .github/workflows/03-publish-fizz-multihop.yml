# Customer talking point: multi-hop Fizz FROM payments-api with immediate-parent-only
# Evidence — root-is-golden needs Evidence walk or layer-prefix (Tier 1+2).
name: 03 Publish Fizz multi-hop

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id shared with prior publish beats
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish-fizz:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL || 'https://tomjpd2.jfrog.io' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prior run artifacts
        uses: actions/download-artifact@v4
        with:
          name: lineage-run-${{ inputs.run_id }}
          path: lab/out/${{ inputs.run_id }}/
        continue-on-error: true

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          run_id: ${{ inputs.run_id }}
          jf_url: ${{ env.JF_URL }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          oidc_audience: ${{ secrets.OIDC_AUDIENCE }}

      - name: Publish Fizz (fizz-service)
        run: ./lab/scripts/steps/publish-fizz.sh

      - name: Upload run artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-run-${{ env.RUN_ID }}
          path: lab/out/${{ env.RUN_ID }}/
          if-no-files-found: warn
