name: 09 Golden Images bootstrap

on:
  workflow_dispatch:
    inputs:
      application_key:
        description: Application key from golden-images/catalog.json
        required: false
        default: golden-alpine
      dry_run:
        description: Print actions only (no mutations)
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
      SERVER_ID: tomjpd2
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI (OIDC)
        if: ${{ !env.ACT }}
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
        with:
          version: 2.120.0
          oidc-provider-name: ${{ secrets.OIDC_PROVIDER_NAME }}
          custom-server-id: ${{ env.SERVER_ID }}

      - name: Setup JFrog CLI (act)
        if: ${{ env.ACT }}
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        with:
          version: 2.120.0
          custom-server-id: ${{ env.SERVER_ID }}

      - name: Validate catalog
        run: ./golden-images/scripts/validate-config.sh "${{ inputs.application_key }}"

      - name: Bootstrap Golden Image platform
        run: ./golden-images/scripts/bootstrap.sh "${{ inputs.application_key }}"
