# Customer talking point: Tier 3 governance — project, PreProd stage, Unified
# Policy evidence gate, and AppTrust app versions bound to lab packages.
name: 07 AppTrust gate bootstrap

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: AppTrust version for payments-api (package tag stays 2.0.0)
        required: false
        type: string
        default: "2.0.1"
      neg_app_version:
        description: AppTrust version for rogue-api (package tag stays 1.0.0)
        required: false
        type: string
        default: "1.0.1"

permissions:
  id-token: write
  contents: read

jobs:
  gate-bootstrap:
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
      JF_URL: ${{ vars.JF_URL }}
      JF_DOCKER_REGISTRY: ${{ vars.JF_DOCKER_REGISTRY }}
      APP_VERSION: ${{ inputs.app_version }}
      NEG_APP_VERSION: ${{ inputs.neg_app_version }}
      PKG_VERSION: "2.0.0"
      NEG_PKG_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup lab
        uses: ./.github/actions/setup-lab
        with:
          jf_url: ${{ env.JF_URL }}
          docker_registry: ${{ env.JF_DOCKER_REGISTRY }}
          oidc_provider_name: ${{ secrets.OIDC_PROVIDER_NAME }}
          write_evidence_key: "false"

      - name: Bootstrap AppTrust gate
        run: ./lab/scripts/steps/gate-bootstrap.sh
